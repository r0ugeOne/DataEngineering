version: '3.8'

services:

  postgres:
    image: postgres:14-alpine
    container_name: de-postgres
    environment:
      POSTGRES_USER: dataeng
      POSTGRES_PASSWORD: dataeng123
      POSTGRES_DB: warehouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - de-network

  localstack:
    image: localstack/localstack:latest
    container_name: de-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,athena,glue
      DEBUG: 1
      DATA_DIR: /tmp/localstack/data
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - "${TMPDIR}:/tmp/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - de-network

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    container_name: de-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/workspace/notebooks
      - ./data:/workspace/data
      - ./scripts:/workspace/scripts
    environment:
      JUPYTER_ENABLE_LAB: "yes"
    networks:
      - de-network

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: de-namenode
    environment:
      - CLUSTER_NAME=de-cluster
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode_data:/hadoop/dfs/name
    networks:
      - de-network

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: de-datanode
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    ports:
      - "9864:9864"
    volumes:
      - datanode_data:/hadoop/dfs/data
    depends_on:
      - namenode
    networks:
      - de-network

volumes:
  postgres_data:
  namenode_data:
  datanode_data:

networks:
  de-network:
    driver: bridge